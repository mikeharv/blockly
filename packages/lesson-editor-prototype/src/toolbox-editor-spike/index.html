<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Toolbox editor prototype</title>
  </head>
  <body>
    <header id="toolbar">
      <strong>Toolbox editor prototype</strong>
      <label>
        Renderer
        <select id="rendererSelect">
          <option value="zelos" selected>Zelos</option>
          <option value="thrasos">Thrasos</option>
          <option value="geras">Geras</option>
        </select>
      </label>
      <label>
        <input id="continuousInput" type="checkbox" checked />
        Continuous toolbox
      </label>
      <label>
        <input id="testBlocksInput" type="checkbox" />
        Test blocks
      </label>
      <button id="logButton" type="button">Log toolbox JSON</button>
      <p id="status" role="status"></p>
    </header>
    <div id="editorDiv"></div>
  </body>
</html>
